name: E2E

on:
  pull_request:
    types:
      - labeled
    branches:
      - 'main'
      - '*-dev'
      - 'releases/v*'

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-select-tests:
    if: ${{ github.event.label.name == 'e2e' }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      has_tests: ${{ steps.scope.outputs.has_tests || steps.noop.outputs.has_tests }}
      test_groups: ${{ steps.scope.outputs.test_groups || steps.noop.outputs.test_groups }}
      matched_modules: ${{ steps.scope.outputs.matched_modules || steps.noop.outputs.matched_modules }}
      packaging_changed: ${{ steps.filter.outputs.packaging || 'false' }}
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      release_tag: ${{ steps.vllm.outputs.release_tag }}
    steps:
      - name: Validate PR title prefix
        run: |
          PR_TITLE=$(curl -sSf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])") || {
              echo "::error::Failed to fetch PR title from GitHub API"
              exit 1
            }

          if [ -z "$PR_TITLE" ]; then
            echo "::error::PR title cannot be empty"
            exit 1
          fi

          echo "Checking PR title: $PR_TITLE"

          VALID_PREFIXES='\[(BugFix|Performance|Test|CI|Feature|Doc|Misc|Community|Refactor)\]'

          if ! echo "$PR_TITLE" | grep -iqE "$VALID_PREFIXES"; then
            echo "::error::PR title must contain one of the following prefixes: [BugFix], [Performance], [Test], [CI], [Feature], [Doc], [Misc], [Community], [Refactor]"
            echo "::error::Example: '[Feature] Add new optimization pass' or 'Add new feature [Feature]'"
            exit 1
          fi

          echo "✓ PR title prefix is valid"

      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read verified vLLM refs
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          release_tag="$(tr -d '[:space:]' < .github/vllm-release-tag.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error file=.github/vllm-main-verified.commit::invalid vLLM main commit: ${main_commit}"
            exit 1
          }
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "::error file=.github/vllm-release-tag.commit::invalid vLLM release tag: ${release_tag}"
            exit 1
          }
          {
            echo "main_commit=${main_commit}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: cp problem matchers
        run: |
          cp .github/workflows/matchers/actionlint.json "$RUNNER_TEMP/actionlint.json"
          cp .github/workflows/matchers/markdownlint.json "$RUNNER_TEMP/markdownlint.json"
          cp .github/workflows/matchers/mypy.json "$RUNNER_TEMP/mypy.json"

      - run: echo "::add-matcher::$RUNNER_TEMP/actionlint.json"
      - run: echo "::add-matcher::$RUNNER_TEMP/markdownlint.json"
      - run: echo "::add-matcher::$RUNNER_TEMP/mypy.json"

      - name: Checkout vllm-project/vllm repo
        uses: actions/checkout@v7.0.1
        with:
          repository: vllm-project/vllm
          path: ./vllm-empty
          ref: ${{ steps.vllm.outputs.main_commit }}

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lint_tracker:
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'requirements-lint.txt'
            packaging:
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'setup.py'
              - 'README.md'
              - 'README.zh.md'
              - 'tests/ut/test_build_metadata.py'
              - 'tests/ut/test_runtime_metadata.py'
            python_src:
              - 'vllm_ascend/**'

      - uses: dorny/paths-filter@v4
        id: selection-filter
        with:
          predicate-quantifier: every
          filters: |
            test_selection:
              - '{vllm_ascend,csrc,cmake,tests,tools}/**'
              - '!tests/ut/test_build_metadata.py'
              - '!tests/ut/test_runtime_metadata.py'
            root_cmake:
              - 'CMakeLists.txt'

      - name: Install vllm-ascend dev (conditional)
        if: steps.filter.outputs.lint_tracker == 'true'
        env:
          UV_INDEX_URL: https://pypi.org/simple
          UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_NO_CACHE: 1
          UV_SYSTEM_PYTHON: 1
        run: |
          pip install uv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install uc-manager
          uv pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run pre-commit
        env:
          PRE_COMMIT_COLOR: always
          FORCE_COLOR: "1"
          TERM: xterm-256color
          SHELLCHECK_OPTS: "--exclude=SC2046,SC2006,SC2086"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }}
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD
          )
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed files to lint."
            exit 0
          fi
          printf 'Linting changed files:\n'
          printf '  %s\n' "${changed_files[@]}"
          pre-commit run --files "${changed_files[@]}" --hook-stage manual --show-diff-on-failure

      - name: Run mypy
        if: steps.filter.outputs.python_src == 'true'
        run: |
          PYTHONPATH="$PYTHONPATH:$(pwd)/vllm-empty"
          export PYTHONPATH
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for python_version in "3.10" "3.11" "3.12"; do
            echo "============================"
            tools/mypy.sh 1 "$python_version"
            echo "============================"
          done

      - name: Validate test coverage config
        if: steps.selection-filter.outputs.test_selection == 'true' || steps.selection-filter.outputs.root_cmake == 'true'
        run: |
          pip install pyyaml
          python3 .github/workflows/scripts/coverage.py

      - name: Select tests based on changed files
        id: scope
        if: steps.selection-filter.outputs.test_selection == 'true' || steps.selection-filter.outputs.root_cmake == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }}
          pip install regex
          python3 .github/workflows/scripts/select_tests.py \
            --diff-base origin/${{ github.base_ref }}

      - name: Set no-tests output when source paths unchanged
        id: noop
        if: steps.selection-filter.outputs.test_selection != 'true' && steps.selection-filter.outputs.root_cmake != 'true'
        run: |
          {
            echo "has_tests=false"
            echo "test_groups=[]"
            echo "matched_modules="
          } >> "$GITHUB_OUTPUT"

  run-selected-tests:
    needs: lint-and-select-tests
    if: ${{ needs.lint-and-select-tests.outputs.has_tests == 'true' && contains(github.event.pull_request.labels.*.name, 'e2e') }}
    strategy:
      matrix:
        vllm_version:
          - ${{ needs.lint-and-select-tests.outputs.main_commit }}
          - ${{ needs.lint-and-select-tests.outputs.release_tag }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ matrix.vllm_version }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      test_groups: ${{ needs.lint-and-select-tests.outputs.test_groups }}

  validate-hust-dual-editable:
    needs: lint-and-select-tests
    if: ${{ needs.lint-and-select-tests.outputs.packaging_changed == 'true' && contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      UV_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
      UV_HTTP_TIMEOUT: 60
      UV_LINK_MODE: copy
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
    steps:
      - name: Checkout vllm-ascend-hust
        uses: actions/checkout@v7.0.1

      - name: Checkout paired vllm-hust
        uses: actions/checkout@v7.0.1
        with:
          repository: vLLM-HUST/vllm-hust
          ref: main
          path: vllm-hust

      - name: Create clean Python environment
        run: |
          python3 -m pip install uv
          uv venv --python 3.12 .venv-dual-editable

      - name: Install Ascend target runtime and core build dependencies
        run: |
          UV_EXTRA_INDEX_URL=https://mirrors.huaweicloud.com/ascend/repos/pypi \
          UV_INDEX_STRATEGY=unsafe-best-match \
            uv pip install \
            --python .venv-dual-editable/bin/python \
            -r ./vllm-hust/requirements/common.txt \
            -r ./requirements.txt \
            -r ./vllm-hust/requirements/build/empty.txt \
            --verbose

      - name: Install paired vllm-hust editable
        run: |
          VLLM_TARGET_DEVICE=empty uv pip install \
            --python .venv-dual-editable/bin/python \
            -e ./vllm-hust \
            --no-build-isolation \
            --no-deps \
            --verbose

      - name: Install vllm-ascend-hust editable
        run: |
          COMPILE_CUSTOM_KERNELS=0 \
          SOC_VERSION=ascend910b1 \
            uv pip install \
            --python .venv-dual-editable/bin/python \
            -e . \
            --no-deps \
            --verbose

      - name: Validate metadata and dependencies
        run: |
          .venv-dual-editable/bin/python -m pytest --noconftest \
            tests/ut/test_build_metadata.py \
            tests/ut/test_runtime_metadata.py \
            -q
          .venv-dual-editable/bin/python - <<'PY'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          from sysconfig import get_path

          for package in ("vllm", "vllm-ascend-hust"):
              dist = distribution(package)
              direct_url = dist.read_text("direct_url.json")
              if direct_url is not None:
                  assert json.loads(direct_url)["dir_info"]["editable"] is True, package
                  continue

              normalized_name = package.replace("-", "_")
              editable_paths = list(
                  Path(get_path("purelib")).glob(
                      f"__editable__.{normalized_name}-*.pth"
                  )
              )
              assert editable_paths, f"{package}: no editable-install metadata"
              assert all(path.is_file() for path in editable_paths)
          PY
          uv pip check --python .venv-dual-editable/bin/python
